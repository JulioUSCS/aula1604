<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de temperatura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <script src="script3.js"></script>
</head>
<body>
    <div>
        <form action="">
            <h2>Calculadora de Temperatura</h2>
            <label for="">Digite a temperatura em C° ou fahrenheit</label><br>
            <input type="number" id="temp" name="temp">
            <br>
            <button type="button" onclick="fahrenheit()">fahrenheit</button>
            <button type="button" onclick="celsius()">celsius</button>

            
            <p id="resultado"></p>
        </form>
    </div>
</body>
</html>
