<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Temperatura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <script src="script5.js"></script>
</head>
<body>
    <div class="container">
        <form action="">
            <h2>Calculadora de Temperatura</h2>
            <label for="temp">Digite a temperatura em C° ou Fahrenheit</label><br>
            <input type="number" id="temp" name="temp" class="form-control">
            <br>

            <label for="temperatura">Escolha a conversão</label>
            <select id="temperatura" name="temperatura" class="form-control" onchange="converterTemperatura()">
                <option value="">Selecione a conversão</option>
                <option value="celsius">Celsius -> Fahrenheit</option>
                <option value="fahrenheit">Fahrenheit -> Celsius</option>
            </select>

            <p id="resultado"></p>
        </form>
    </div>
</body>
</html>
